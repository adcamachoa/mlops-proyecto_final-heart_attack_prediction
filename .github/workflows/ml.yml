name: ML Pipeline CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-train:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies (make install)
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        # Detiene la ejecución si hay errores graves de sintaxis
        flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
        # Las advertencias menores no detendrán el pipeline
        flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Run tests (make test)
      run: |
        pytest tests/

    - name: Run pipeline (make train)
      run: |
        python src/preprocess.py
        python src/train.py

    - name: Upload Model Artifact
      uses: actions/upload-artifact@v4
      with:
        name: trained-model-mlruns
        path: mlruns/